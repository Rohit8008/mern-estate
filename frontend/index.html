<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Primary SEO -->
  <title>Real Vista — CRM for real estate agencies</title>
  <meta name="description" content="Real Vista is a CRM for real estate agencies in India: leads, property owners, listings, deals and paperwork in one workspace, with share links you control." />
  <meta name="keywords" content="real estate CRM, estate agency software, property management, lead management, real vista, india" />
  <meta name="author" content="Real Vista" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="__SITE_URL__/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Real Vista" />
  <meta property="og:title" content="Real Vista — CRM for real estate agencies" />
  <meta property="og:description" content="Real Vista is a CRM for real estate agencies in India: leads, property owners, listings, deals and paperwork in one workspace, with share links you control." />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:image" content="__SITE_URL__/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Real Vista — CRM for real estate agencies" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  <meta name="twitter:title" content="Real Vista — CRM for real estate agencies" />
  <meta name="twitter:description" content="Real Vista is a CRM for real estate agencies in India: leads, property owners, listings, deals and paperwork in one workspace, with share links you control." />

  <!-- PWA / App -->
  <meta name="theme-color" content="#2b6faa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Real Vista" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- JSON-LD Organization -->
  <!-- SoftwareApplication, not RealEstateAgent: Real Vista sells software to
       agencies and is not a party to any property transaction. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Real Vista",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, Android",
    "url": "__SITE_URL__/",
    "image": "__SITE_URL__/og-image.png",
    "publisher": { "@type": "Organization", "name": "Real Vista", "url": "__SITE_URL__/", "logo": "__SITE_URL__/pwa-512.png" },
    "description": "CRM for real estate agencies: leads, property owners, listings, deals and paperwork in one workspace."
  }
  </script>

  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "WebSite", "name": "Real Vista", "url": "__SITE_URL__/", "inLanguage": "en-IN" }
  </script>

  <!-- Fonts: self-hosted (see src/fonts.css). Preload only the two faces the
       hero actually paints with, so the critical path stays short. -->
  <link rel="preload" href="/fonts/outfit-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/outfit-800-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
